server:
  port: 8080

spring:
  application:
    name: ai-career-copilot-backend
  datasource:
    # Uses persistent local H2 file database by default for frictionless zero-config dev
    url: jdbc:h2:file:./data/careerdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

# AI Microservice integration endpoint
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
